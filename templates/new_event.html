{% extends 'base.html' %}

{% block title %}New Event{% endblock %}

{% block content %}
<section class="card shadow-sm border-0">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <h1 class="h3 mb-1">Create Event</h1>
        <p class="text-muted mb-0">Create a separate event and add members to it.</p>
      </div>
      <a href="{{ url_for('events') }}" class="btn btn-outline-secondary">Back to Events</a>
    </div>

    <form method="POST" action="{{ url_for('new_event') }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Event Name</label>
          <input type="text" class="form-control" name="name" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">Date From</label>
          <input type="date" class="form-control" name="date_from" value="{{ date_from_value }}" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">Date To</label>
          <input type="date" class="form-control" name="date_to" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Number of Boats Needed</label>
          <input type="number" class="form-control" name="boats_needed" min="0" value="0" />
        </div>
        <div class="col-md-9">
          <div class="alert alert-light border mb-0 h-100 d-flex align-items-center">
            Members can be added later from the event list by clicking Join Event.
          </div>
        </div>
        <div class="col-md-4">
          <label class="form-label">What3words Location 1</label>
          <input type="text" class="form-control" name="what3words_location_1" placeholder="word.word.word" />
        </div>
        <div class="col-md-4">
          <label class="form-label">What3words Location 2</label>
          <input type="text" class="form-control" name="what3words_location_2" placeholder="word.word.word" />
        </div>
        <div class="col-md-4">
          <label class="form-label">What3words Location 3</label>
          <input type="text" class="form-control" name="what3words_location_3" placeholder="word.word.word" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Latitude</label>
          <input type="number" class="form-control" name="latitude" min="-90" max="90" step="any" placeholder="e.g. 54.9783" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Longitude</label>
          <input type="number" class="form-control" name="longitude" min="-180" max="180" step="any" placeholder="e.g. -1.6178" />
        </div>
        <div class="col-12">
          <label class="form-label">Notes</label>
          <textarea class="form-control" name="notes" rows="4"></textarea>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Create Event</button>
        <a href="{{ url_for('events') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
