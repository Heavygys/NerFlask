{% extends 'base.html' %}

{% block title %}Reset password{% endblock %}

{% block content %}
<section class="card shadow-sm border-0 mx-auto mt-5" style="max-width: 480px;">
  <div class="card-body p-4">
    <h1 class="h3 mb-3">Reset password</h1>
    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
      <div class="mb-3">
        <label class="form-label">New password</label>
        <div class="input-group">
          <input type="password" class="form-control password-input" name="password" id="reset-password" required minlength="8" />
          <button class="btn btn-outline-secondary toggle-password" type="button" data-target="reset-password">Show</button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <div class="input-group">
          <input type="password" class="form-control password-input" name="confirm_password" id="reset-confirm-password" required minlength="8" />
          <button class="btn btn-outline-secondary toggle-password" type="button" data-target="reset-confirm-password">Show</button>
        </div>
        <div class="form-text">Minimum 8 characters with uppercase, lowercase, a number, and a symbol.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Update password</button>
    </form>
    <div class="mt-3 text-center">
      <a href="{{ url_for('login') }}">Back to login</a>
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.toggle-password').forEach(function (button) {
    button.addEventListener('click', function () {
      const input = document.getElementById(button.dataset.target);
      if (!input) {
        return;
      }
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      button.textContent = isHidden ? 'Hide' : 'Show';
      button.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  });
});
</script>
{% endblock %}
