{% extends 'base.html' %}

{% block title %}Edit Event{% endblock %}

{% block content %}
<section class="card shadow-sm border-0">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <h1 class="h3 mb-1">Edit Event</h1>
        <p class="text-muted mb-0">Update the event and select which members are on it.</p>
      </div>
      <a href="{{ url_for('events') }}" class="btn btn-outline-secondary">Back to Events</a>
    </div>

    <form method="POST" action="{{ url_for('edit_event', event_id=event.id) }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Event Name</label>
          <input type="text" class="form-control" name="name" value="{{ event.name }}" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">Date From</label>
          <input type="date" class="form-control" name="date_from" value="{{ event.date_from.strftime('%Y-%m-%d') }}" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">Date To</label>
          <input type="date" class="form-control" name="date_to" value="{{ event.date_to.strftime('%Y-%m-%d') if event.date_to else '' }}" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Number of Boats Needed</label>
          <input type="number" class="form-control" name="boats_needed" min="0" value="{{ event.boats_needed or 0 }}" />
        </div>
        <div class="col-md-9">
          <label class="form-label">Members on this event</label>
          <select class="form-select" name="member_ids" multiple size="12">
            {% for member in all_members %}
              <option value="{{ member.id }}" {% if member in event.members %}selected{% endif %}>{{ member.first_name }} {{ member.last_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">What3words Location 1</label>
          <input type="text" class="form-control" name="what3words_location_1" value="{{ event.what3words_location_1 or '' }}" placeholder="word.word.word" />
        </div>
        <div class="col-md-4">
          <label class="form-label">What3words Location 2</label>
          <input type="text" class="form-control" name="what3words_location_2" value="{{ event.what3words_location_2 or '' }}" placeholder="word.word.word" />
        </div>
        <div class="col-md-4">
          <label class="form-label">What3words Location 3</label>
          <input type="text" class="form-control" name="what3words_location_3" value="{{ event.what3words_location_3 or '' }}" placeholder="word.word.word" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Latitude</label>
          <input type="number" class="form-control" name="latitude" min="-90" max="90" step="any" value="{{ event.latitude if event.latitude is not none else '' }}" placeholder="e.g. 54.9783" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Longitude</label>
          <input type="number" class="form-control" name="longitude" min="-180" max="180" step="any" value="{{ event.longitude if event.longitude is not none else '' }}" placeholder="e.g. -1.6178" />
        </div>
        <div class="col-12">
          <label class="form-label">Notes</label>
          <textarea class="form-control" name="notes" rows="4">{{ event.notes or '' }}</textarea>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('events') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
